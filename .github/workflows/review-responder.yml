name: Review Responder

on:
  pull_request_review:
  pull_request_review_comment:

permissions:
  contents: write
  pull-requests: write

jobs:
  respond:
    uses: JacobPEvans/.github-ai/.github/workflows/cc-pr-review-responder.yml@topic/merge-flow-r2 # fixture: follows the topic branch
    with:
      repo_context: "Upstream merge-flow fixture; nothing here is production."
    secrets:
      LLM_ROUTER_BASE_URL: ${{ secrets.LLM_ROUTER_BASE_URL }}
      LLM_ROUTER_API_KEY: ${{ secrets.LLM_ROUTER_API_KEY }}
      OPENBAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
      GH_APP_CLAUDE_BOT_PRIVATE_KEY: ${{ secrets.GH_APP_CLAUDE_BOT_PRIVATE_KEY }}
